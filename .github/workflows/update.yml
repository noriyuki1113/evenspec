---
name: Daily data update

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest prices and rebuild
        run: |
          python3 scripts/fetch_data.py
          python3 scripts/build_site.py

      - name: Commit if anything changed
        run: |
          git config user.name "evenspec-bot"
          git config user.email "bot@evenspec.com"
          git add data/models.json data/price_events.json dist
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily price data update ($(date -u +%F))"
            git push
          fi
---
